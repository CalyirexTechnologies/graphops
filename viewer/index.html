<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GraphOps</title>
<!-- An empty data: icon. Without it the browser requests /favicon.ico, the
     static server answers 404, and the console opens with an error that has
     nothing to do with the page. -->
<link rel="icon" href="data:,">
<style>
  :root {
    --bg: #0f1216;
    --panel: #161b22;
    --line: #262d36;
    --ink: #e6edf3;
    --dim: #8b949e;
    --untrusted: #d9534f;
    --perimeter: #d9a441;
    --internal: #4f8cc9;
    --crown: #46a758;
    --hot: #ff7b51;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 14px/1.5 ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  header { padding: 18px 24px 14px; border-bottom: 1px solid var(--line); }
  h1 { margin: 0 0 4px; font-size: 19px; font-weight: 650; letter-spacing: -0.01em; }
  .sub { color: var(--dim); font-size: 13px; }
  .wrap { display: grid; grid-template-columns: 1fr 380px; gap: 0; height: calc(100vh - 72px); }
  @media (max-width: 900px) { .wrap { grid-template-columns: 1fr; height: auto; } }
  .canvas { position: relative; overflow: hidden; }
  .side { border-left: 1px solid var(--line); background: var(--panel); overflow-y: auto; }
  .tabs { display: flex; border-bottom: 1px solid var(--line); }
  .tab {
    flex: 1; padding: 11px 4px; text-align: center; cursor: pointer;
    color: var(--dim); font-size: 11.5px; font-weight: 560;
    background: none; border: 0; border-bottom: 2px solid transparent;
  }
  .tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--hot); }
  .pane { padding: 16px 18px; }
  .pane[hidden] { display: none !important; }
  .stat { font-size: 27px; font-weight: 640; letter-spacing: -0.02em; }
  .stat small { display: block; font-size: 12.5px; font-weight: 400; color: var(--dim); letter-spacing: 0; margin-top: 2px; }
  .row { padding: 9px 0; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 12px; }
  .row:last-child { border-bottom: 0; }
  .row b { font-weight: 560; }
  .k { color: var(--dim); font-size: 12.5px; }
  .bar { height: 4px; background: var(--line); border-radius: 2px; margin-top: 5px; }
  .bar i { display: block; height: 100%; background: var(--hot); border-radius: 2px; }
  .step { display: flex; gap: 8px; align-items: baseline; padding: 5px 0; font-size: 12.5px; }
  .step .t { color: var(--dim); min-width: 112px; }
  .note { color: var(--dim); font-size: 12.5px; margin: 10px 0 0; }
  .flag { color: var(--hot); font-weight: 560; }
  .legend { position: absolute; left: 18px; bottom: 14px; display: flex; gap: 14px; font-size: 12px; color: var(--dim); }
  .legend span { display: flex; align-items: center; gap: 6px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
  .zlabel { fill: var(--dim); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; }
  .nlabel { fill: var(--ink); font-size: 11.5px; }
  .edge { stroke: #30363d; fill: none; }
  .edge.on { stroke: var(--hot); stroke-width: 2.2; }
  .node rect { stroke-width: 1.5; }
  .node.on rect { stroke: var(--hot); stroke-width: 2.4; }
</style>
</head>
<body>
<header>
  <h1>GraphOps</h1>
  <div class="sub" id="estate">loading</div>
</header>

<div class="wrap">
  <div class="canvas"><svg id="svg" width="100%" height="100%"
       preserveAspectRatio="xMidYMin meet"></svg>
    <div class="legend">
      <span><i class="dot" style="background:var(--untrusted)"></i>untrusted</span>
      <span><i class="dot" style="background:var(--perimeter)"></i>perimeter</span>
      <span><i class="dot" style="background:var(--internal)"></i>internal</span>
      <span><i class="dot" style="background:var(--crown)"></i>crown jewel</span>
    </div>
  </div>

  <div class="side">
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" aria-selected="true" data-pane="exposure">Exposure</button>
      <button class="tab" role="tab" aria-selected="false" data-pane="blast">Blast radius</button>
      <button class="tab" role="tab" aria-selected="false" data-pane="novel">New routes</button>
      <button class="tab" role="tab" aria-selected="false" data-pane="privilege">Granted vs used</button>
    </div>
    <div class="pane" id="pane-exposure"></div>
    <div class="pane" id="pane-blast" hidden></div>
    <div class="pane" id="pane-novel" hidden></div>
    <div class="pane" id="pane-privilege" hidden></div>
  </div>
</div>

<script>
const ZONES = ['untrusted', 'perimeter', 'internal', 'crown'];
const COLOUR = { untrusted: '#d9534f', perimeter: '#d9a441', internal: '#4f8cc9', crown: '#46a758' };
const esc = (s) => String(s).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));

let DATA = null, highlight = new Set();

function layout(nodes) {
  const byZone = {};
  ZONES.forEach(z => byZone[z] = []);
  nodes.forEach(n => (byZone[n.zone] || byZone.internal).push(n));
  const pos = {};
  const colW = 260, rowH = 34, top = 54;
  ZONES.forEach((z, zi) => {
    byZone[z].sort((a, b) => a.key.localeCompare(b.key));
    byZone[z].forEach((n, i) => {
      pos[n.id] = { x: 40 + zi * colW, y: top + i * rowH, node: n };
    });
  });
  return pos;
}

function draw() {
  const svg = document.getElementById('svg');
  const pos = layout(DATA.estate.nodes);
  const W = 40 + ZONES.length * 260 + 180;
  const H = Math.max(...Object.values(pos).map(p => p.y)) + 70;
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);

  let out = '';
  ZONES.forEach((z, zi) => {
    out += `<text class="zlabel" x="${40 + zi * 260}" y="30">${z}</text>`;
  });

  DATA.estate.edges.forEach(e => {
    const a = pos[e.src], b = pos[e.dst];
    if (!a || !b) return;
    const on = highlight.has(e.src + '>' + e.dst);
    const x1 = a.x + 170, y1 = a.y + 11, x2 = b.x, y2 = b.y + 11;
    const mx = (x1 + x2) / 2;
    out += `<path class="edge${on ? ' on' : ''}" d="M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}"/>`;
  });

  Object.values(pos).forEach(p => {
    const n = p.node;
    const on = highlight.has(n.id);
    const fill = COLOUR[n.zone] || COLOUR.internal;
    out += `<g class="node${on ? ' on' : ''}">
      <rect x="${p.x}" y="${p.y}" width="170" height="23" rx="5"
            fill="${fill}22" stroke="${fill}"/>
      <text class="nlabel" x="${p.x + 9}" y="${p.y + 16}">${esc(trim(n.key, 25))}</text>
    </g>`;
  });
  svg.innerHTML = out;
}

const trim = (s, n) => s.length <= n ? s : s.slice(0, n - 1) + '…';

function steps(list) {
  return list.map(s => `<div class="step">
      <span class="t">${esc(s.tactic || 'no tactic')}</span>
      <span>${esc(trim(s.from.key, 22))} &rarr; ${esc(trim(s.to.key, 22))}</span>
    </div>`).join('');
}

function render() {
  document.getElementById('estate').textContent =
    DATA.estate.name + '  ·  ' + DATA.estate.nodes.length + ' nodes, '
    + DATA.estate.edges.length + ' edges';

  const e = DATA.exposure;
  document.getElementById('pane-exposure').innerHTML = `
    <div class="stat">${e.path_count}<small>routes from the internet to a crown jewel</small></div>
    <p class="note">Cheapest by attacker effort, not by hop count. Cost ${e.cheapest.cost.toFixed(1)}.</p>
    ${steps(e.cheapest.steps)}
    <p class="note" style="margin-top:16px"><b>Choke points.</b> Cutting one removes every route through it.</p>
    ${e.choke_points.slice(0, 5).map(c => `<div class="row" style="display:block">
        <div><b>${esc(trim(c.key, 30))}</b> <span class="k">on ${c.paths_through} of ${e.path_count}</span></div>
        <div class="bar"><i style="width:${(c.share * 100).toFixed(0)}%"></i></div>
      </div>`).join('')}`;

  const b = DATA.blast;
  document.getElementById('pane-blast').innerHTML = `
    <div class="stat">${b.total}<small>systems in reach if ${esc(b.origin.key)} is taken</small></div>
    ${Object.entries(b.hops).map(([h, m]) => `<div class="row">
        <span class="k">${h} hop${h === '1' ? '' : 's'} away</span><b>${m.length}</b></div>`).join('')}
    <p class="note" style="margin-top:14px">Crown jewels reached</p>
    ${b.crown_jewels_reached.map(c => `<div class="row"><b class="flag">${esc(c.key)}</b></div>`).join('')
      || '<div class="row"><span class="k">none</span></div>'}`;

  const pv = DATA.privilege;
  document.getElementById('pane-privilege').innerHTML = `
    <div class="stat">${pv.dormant.length}<small>grants nobody has ever used</small></div>
    <p class="note">${pv.granted} entitlements granted, ${pv.exercised} ever exercised.
    An unused grant still works for whoever takes the credential.</p>
    ${pv.dormant.map(d => `<div class="row" style="display:block">
        <div><b>${esc(d.identity.key)}</b> <span class="k">may reach</span>
          <b class="${d.reaches_crown_jewel ? 'flag' : ''}">${esc(d.target.key)}</b></div>
        ${d.reaches_crown_jewel ? '<div class="k">crown jewel, and it has never been touched</div>' : ''}
      </div>`).join('')}
    <p class="note" style="margin-top:14px">Nobody has to be attacked for this
    to be worth fixing.</p>`;

  const n = DATA.novel;
  const unflagged = n.new_reach.filter(r => r.unflagged_by_rules);
  document.getElementById('pane-novel').innerHTML = `
    <div class="stat">${unflagged.length}<small>new routes that no detection rule fired on</small></div>
    <p class="note">${n.new_edge_count} relationships first seen in the last ${n.window_hours} hours.</p>
    ${unflagged.slice(0, 2).map(r => `
      <div class="row" style="display:block">
        <div><b>${esc(r.actor.key)}</b> <span class="k">now reaches</span> <b class="flag">${esc(r.target.key)}</b></div>
        ${steps(r.steps)}
      </div>`).join('')}
    <p class="note" style="margin-top:14px"><b>Grouped as one incident, not six.</b></p>
    ${n.incidents.map(g => `<div class="row"><span>${g.map(x => esc(trim(x.key, 18))).join(', ')}</span><b>${g.length}</b></div>`).join('')}`;
}

function select(name) {
  document.querySelectorAll('.tab').forEach(t =>
    t.setAttribute('aria-selected', String(t.dataset.pane === name)));
  ['exposure', 'blast', 'novel', 'privilege'].forEach(p =>
    document.getElementById('pane-' + p).hidden = (p !== name));

  highlight = new Set();
  if (name === 'exposure' && DATA.exposure.cheapest) {
    DATA.exposure.cheapest.steps.forEach(s => {
      highlight.add(s.from.id); highlight.add(s.to.id);
      highlight.add(s.from.id + '>' + s.to.id);
    });
  } else if (name === 'blast') {
    highlight.add(DATA.blast.origin.id);
    Object.values(DATA.blast.hops).forEach(m => m.forEach(x => highlight.add(x.id)));
  } else if (name === 'privilege') {
    DATA.privilege.dormant.forEach(d => {
      highlight.add(d.identity.id); highlight.add(d.target.id);
      highlight.add(d.identity.id + '>' + d.target.id);
    });
  } else if (name === 'novel') {
    DATA.novel.new_reach.filter(r => r.unflagged_by_rules).forEach(r =>
      r.steps.forEach(s => {
        highlight.add(s.from.id); highlight.add(s.to.id);
        highlight.add(s.from.id + '>' + s.to.id);
      }));
  }
  draw();
}

fetch('../data/answers.json').then(r => r.json()).then(d => {
  DATA = d;
  render();
  document.querySelectorAll('.tab').forEach(t =>
    t.addEventListener('click', () => select(t.dataset.pane)));
  select('exposure');
});
</script>
</body>
</html>
