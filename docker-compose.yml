# Brings up the API and a Neo4j instance so both graph backends can be
# compared against each other, which is what `graphops.demo_neo4j` does.
#
# Nothing here carries a default secret. GRAPHOPS_SIGNING_KEY and
# NEO4J_PASSWORD must be present in the environment or in a .env file beside
# this one, and compose fails if they are absent. That is deliberate: a
# compose file with a working default password is a compose file somebody
# deploys.

services:
  api:
    build: .
    image: graphops:local
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      GRAPHOPS_SIGNING_KEY: ${GRAPHOPS_SIGNING_KEY:?set it, or run graphops keygen}
      GRAPHOPS_ENV: ${GRAPHOPS_ENV:-development}
      GRAPHOPS_DB_PATH: /data/graphops.db
      GRAPHOPS_CONNECTOR_MODE: ${GRAPHOPS_CONNECTOR_MODE:-replay}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?set a Neo4j password}
    volumes:
      - graphops-data:/data
    depends_on:
      neo4j:
        condition: service_healthy
    # The application does not need to write anywhere but its volume.
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  neo4j:
    image: neo4j:5.26-community
    restart: unless-stopped
    ports:
      # Bound to loopback. The browser and bolt ports are not for the network.
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?set a Neo4j password}
      NEO4J_server_memory_heap_max__size: 512M
      # No APOC and no GDS. The Cypher in cypher/ is plain on purpose, so it
      # runs on a stock Community server.
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  graphops-data:
  neo4j-data:
